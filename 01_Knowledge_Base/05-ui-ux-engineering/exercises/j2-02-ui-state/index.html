<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI State · bài làm</title>
    <style>
      :root {
        --bg: #f6f4ef;
        --surface: #fffdf8;
        --ink: #1c1917;
        --muted: #57534e;
        --line: #e7e5e4;
        --warn: #9a3412;
        --warn-bg: #ffedd5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
      }
      .banner {
        max-width: 40rem;
        margin: 1rem auto 0;
        padding: 0.75rem 1rem;
        background: var(--warn-bg);
        color: var(--warn);
        border-radius: 8px;
        font-size: 0.9rem;
      }
      #root {
        max-width: 40rem;
        margin: 1rem auto 2rem;
        padding: 0 1rem;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem 1.1rem;
        margin-bottom: 0.85rem;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1rem;
        align-items: center;
        margin-bottom: 0.25rem;
      }
      .toolbar label {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.92rem;
      }
      .toolbar input[type="search"] {
        flex: 1;
        min-width: 12rem;
        font: inherit;
        padding: 0.45rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .hint {
        color: var(--muted);
        font-size: 0.85rem;
        margin: 0 0 0.75rem;
      }
      .project h3 {
        margin: 0 0 0.25rem;
        font-size: 1rem;
      }
      .project p {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .star {
        color: #ca8a04;
        font-size: 0.85rem;
      }
      .empty {
        color: var(--muted);
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <!--
      BÀI LÀM — lift query + starredOnly lên ProjectsPage; SearchBar controlled.
      State map: ./state-map.md
      Reset: cp before.html index.html
      Clarify:
      1. Search và list phải cùng một query — không thì gõ không lọc.
      2. starredOnly là UI state tạm của trang (session xem), không phải server truth.
      3. Bài này không persist sau reload (chưa cần URL/global store).
    -->
    <div class="banner">
      <strong>index.html</strong> — bài làm: một nguồn sự thật cho search +
      starred filter.
    </div>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
    <script type="text/babel">
      const { useState } = React;
      const { createRoot } = ReactDOM;

      const PROJECTS = [
        {
          id: 1,
          title: "Portal changelog",
          desc: "Trang tĩnh liệt kê thay đổi nội bộ.",
          starred: true,
        },
        {
          id: 2,
          title: "Profile card",
          desc: "Card hồ sơ — semantics & mockup spec.",
          starred: false,
        },
        {
          id: 3,
          title: "Box model lab",
          desc: "Đo padding / border trong DevTools.",
          starred: true,
        },
        {
          id: 4,
          title: "Flex grid lab",
          desc: "Một trục vs lưới hai cột.",
          starred: false,
        },
      ];

      function SearchBar({ query, onQueryChange }) {
        return (
          <input
            type="search"
            placeholder="Tìm theo tên dự án…"
            value={query}
            onChange={(e) => onQueryChange(e.target.value)}
            aria-label="Tìm dự án"
          />
        );
      }

      function StarredFilter({ starredOnly, onStarredOnlyChange }) {
        return (
          <label>
            <input
              type="checkbox"
              checked={starredOnly}
              onChange={(e) => onStarredOnlyChange(e.target.checked)}
            />
            Chỉ dự án starred
          </label>
        );
      }

      function ProjectList({ projects }) {
        if (projects.length === 0) {
          return <p className="empty">Không có dự án khớp.</p>;
        }

        return projects.map((p) => (
          <article className="card project" key={p.id}>
            <h3>
              {p.title}{" "}
              {p.starred ? (
                <span className="star" title="starred">
                  ★
                </span>
              ) : null}
            </h3>
            <p>{p.desc}</p>
          </article>
        ));
      }

      function ProjectsPage() {
        const [query, setQuery] = useState("");
        const [starredOnly, setStarredOnly] = useState(false);

        const visible = PROJECTS.filter((p) => {
          const q = query.trim().toLowerCase();
          const matchQuery = !q || p.title.toLowerCase().includes(q);
          const matchStar = !starredOnly || p.starred;
          return matchQuery && matchStar;
        });

        return (
          <main>
            <header className="card">
              <h1 style={{ margin: "0 0 0.75rem", fontSize: "1.25rem" }}>
                Projects
              </h1>
              <div className="toolbar">
                <SearchBar query={query} onQueryChange={setQuery} />
                <StarredFilter
                  starredOnly={starredOnly}
                  onStarredOnlyChange={setStarredOnly}
                />
              </div>
              <p className="hint">
                Search + starred là controlled từ <code>ProjectsPage</code>.
                List nhận mảng đã lọc — không mutate <code>PROJECTS</code>.
              </p>
            </header>
            <ProjectList projects={visible} />
          </main>
        );
      }

      createRoot(document.getElementById("root")).render(<ProjectsPage />);
    </script>
  </body>
</html>
