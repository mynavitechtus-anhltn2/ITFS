<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI State · before</title>
    <style>
      :root {
        --bg: #f6f4ef;
        --surface: #fffdf8;
        --ink: #1c1917;
        --muted: #57534e;
        --line: #e7e5e4;
        --warn: #9a3412;
        --warn-bg: #ffedd5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
      }
      .banner {
        max-width: 40rem;
        margin: 1rem auto 0;
        padding: 0.75rem 1rem;
        background: var(--warn-bg);
        color: var(--warn);
        border-radius: 8px;
        font-size: 0.9rem;
      }
      #root {
        max-width: 40rem;
        margin: 1rem auto 2rem;
        padding: 0 1rem;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem 1.1rem;
        margin-bottom: 0.85rem;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1rem;
        align-items: center;
        margin-bottom: 0.25rem;
      }
      .toolbar label {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.92rem;
      }
      .toolbar input[type="search"] {
        flex: 1;
        min-width: 12rem;
        font: inherit;
        padding: 0.45rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .hint {
        color: var(--muted);
        font-size: 0.85rem;
        margin: 0 0 0.75rem;
      }
      .project h3 {
        margin: 0 0 0.25rem;
        font-size: 1rem;
      }
      .project p {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .star {
        color: #ca8a04;
        font-size: 0.85rem;
      }
      .empty {
        color: var(--muted);
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <!--
      BEFORE — state sai chỗ. KHÔNG sửa.
      SearchBar tự giữ query; ProjectList tự giữ starredOnly + không nhận query từ anh em.
    -->
    <div class="banner">
      <strong>before</strong> — gõ search / tick starred sẽ thấy list không đồng
      bộ đúng ý. Lift state ở <code>index.html</code>.
    </div>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
    <script type="text/babel">
      const { useState } = React;
      const { createRoot } = ReactDOM;

      const PROJECTS = [
        {
          id: 1,
          title: "Portal changelog",
          desc: "Trang tĩnh liệt kê thay đổi nội bộ.",
          starred: true,
        },
        {
          id: 2,
          title: "Profile card",
          desc: "Card hồ sơ — semantics & mockup spec.",
          starred: false,
        },
        {
          id: 3,
          title: "Box model lab",
          desc: "Đo padding / border trong DevTools.",
          starred: true,
        },
        {
          id: 4,
          title: "Flex grid lab",
          desc: "Một trục vs lưới hai cột.",
          starred: false,
        },
      ];

      // SAI: query chỉ nằm trong SearchBar — List không biết
      function SearchBar() {
        const [query, setQuery] = useState("");
        return (
          <input
            type="search"
            placeholder="Tìm theo tên dự án…"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            aria-label="Tìm dự án"
          />
        );
      }

      // SAI: starredOnly local; list luôn full PROJECTS (bỏ qua search)
      function ProjectList() {
        const [starredOnly, setStarredOnly] = useState(false);
        const visible = starredOnly
          ? PROJECTS.filter((p) => p.starred)
          : PROJECTS;

        return (
          <div>
            <label>
              <input
                type="checkbox"
                checked={starredOnly}
                onChange={(e) => setStarredOnly(e.target.checked)}
              />
              Chỉ dự án starred
            </label>
            <p className="hint">
              (Before) Checkbox chỉ lọc trong List — ô search bên trên là state
              khác, không nối được.
            </p>
            {visible.length === 0 ? (
              <p className="empty">Không có dự án khớp.</p>
            ) : (
              visible.map((p) => (
                <article className="card project" key={p.id}>
                  <h3>
                    {p.title}{" "}
                    {p.starred ? (
                      <span className="star" title="starred">
                        ★
                      </span>
                    ) : null}
                  </h3>
                  <p>{p.desc}</p>
                </article>
              ))
            )}
          </div>
        );
      }

      function ProjectsPage() {
        return (
          <main>
            <header className="card">
              <h1 style={{ margin: "0 0 0.75rem", fontSize: "1.25rem" }}>
                Projects
              </h1>
              <div className="toolbar">
                <SearchBar />
              </div>
            </header>
            <ProjectList />
          </main>
        );
      }

      createRoot(document.getElementById("root")).render(<ProjectsPage />);
    </script>
  </body>
</html>
