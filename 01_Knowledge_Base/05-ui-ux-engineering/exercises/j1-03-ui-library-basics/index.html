<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Library · bài làm</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      :root {
        --bg: #f6f4ef;
        --warn: #9a3412;
        --warn-bg: #ffedd5;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
      }
      .banner {
        max-width: 28rem;
        margin: 1rem auto 0;
        font-size: 0.9rem;
        color: var(--warn);
        background: var(--warn-bg);
        border: 1px solid #fed7aa;
        border-radius: 8px;
        padding: 0.75rem 0.9rem;
      }
      .page {
        max-width: 28rem;
        margin: 1.25rem auto 2rem;
        padding: 0 1rem;
      }
    </style>
  </head>
  <body>
    <!--
      BÀI LÀM — Bootstrap 5 CDN + Card / form-control / btn theo docs.
      Đề: README.md · Docs: https://getbootstrap.com/docs/5.3/

      Clarify:
      1. Lib + version: Bootstrap 5.3 (CDN CSS).
      2. Đăng nhập = submit; SSO = button (hành động trên trang); Quên mật khẩu = <a>.
      3. Placeholder/copy giữ như before (email + mật khẩu) — chưa có copy lỗi/validate.
      Note class từ docs:
      - card / card-body / card-title / card-text
      - form-label + form-control (kèm id/for)
      - btn btn-primary (submit), btn btn-outline-secondary (SSO), btn btn-link (link phụ)
    -->
    <div class="banner">
      <strong>index.html</strong> — bài làm. Gắn Bootstrap 5, thay box homemade
      bằng <code>card</code> + <code>form-control</code> + <code>btn</code>. So
      với <code>before.html</code> sau khi xong.
    </div>

    <main class="page">
      <div class="card">
        <div class="card-body">
          <h1 class="card-title h4">Đăng nhập ITFS</h1>
          <p class="card-text text-secondary">
            Portal nội bộ · dùng tài khoản công ty
          </p>
          <form action="#" method="get" onsubmit="return false;">
            <div class="mb-3">
              <label class="form-label" for="login-email">Email</label>
              <input
                id="login-email"
                class="form-control"
                type="email"
                name="email"
                autocomplete="username"
                placeholder="you@company.com"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="login-password">Mật khẩu</label>
              <input
                id="login-password"
                class="form-control"
                type="password"
                name="password"
                autocomplete="current-password"
                placeholder="••••••••"
              />
            </div>
            <div class="d-grid gap-2">
              <button class="btn btn-primary" type="submit">Đăng nhập</button>
              <button
                class="btn btn-outline-secondary"
                type="button"
                onclick="alert('sso')"
              >
                Đăng nhập SSO
              </button>
            </div>
            <a class="btn btn-link px-0" href="#forgot">Quên mật khẩu?</a>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
