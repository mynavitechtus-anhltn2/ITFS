<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessibility · bài làm</title>
    <style>
      :root {
        --bg: #f6f4ef;
        --surface: #fffdf8;
        --ink: #1c1917;
        --muted: #57534e;
        --line: #e7e5e4;
        --accent: #0f766e;
        --warn: #9a3412;
        --warn-bg: #ffedd5;
      }
      * {
        box-sizing: border-box;
      }
      :focus {
        outline: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      body {
        margin: 0;
        font-family: system-ui, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
      }
      .banner {
        max-width: 40rem;
        margin: 1rem auto 0;
        padding: 0.75rem 1rem;
        background: var(--warn-bg);
        color: var(--warn);
        border-radius: 8px;
        font-size: 0.9rem;
      }
      .wrap {
        max-width: 40rem;
        margin: 1rem auto 2rem;
        padding: 0 1rem;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem 1.1rem;
        margin-bottom: 0.85rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .chip,
      .icon-btn,
      .cta {
        display: inline-block;
        padding: 0.4rem 0.75rem;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
        user-select: none;
        font: inherit;
        text-decoration: none;
        color: inherit;
      }
      .cta {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .icon-btn {
        width: 2.25rem;
        text-align: center;
        padding-left: 0;
        padding-right: 0;
      }
      .field {
        margin: 0.75rem 0;
      }
      .field label {
        display: block;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      .field input {
        width: 100%;
        font: inherit;
        padding: 0.45rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .hint {
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <!--
      BÀI LÀM — native button/a/input + label; bỏ tabindex dương; focus-visible.
      Audit: ./audit.md
      Reset: cp before.html index.html
      Clarify:
      1. All / Starred / Tạo mới / Settings = button (hành động trên trang). Về Portal = <a>.
      2. Icon ⚙️ đọc là “Cài đặt” (aria-label), không aria-hidden.
      3. Không xóa outline: :focus-visible giữ ring cho bàn phím, chuột không bắt buộc.
    -->
    <div class="banner">
      <strong>index.html</strong> — bài làm: sửa để Tab/Enter hoạt động đúng.
      Ghi findings vào <code>audit.md</code>.
    </div>

    <div class="wrap">
      <main class="card">
        <h1>Projects</h1>

        <div class="toolbar">
          <button class="chip" type="button" onclick="alert('all')">All</button>
          <button class="chip" type="button" onclick="alert('starred')">
            Starred
          </button>
          <button class="cta" type="button" onclick="alert('create')">
            Tạo mới
          </button>
          <button
            class="icon-btn"
            type="button"
            onclick="alert('settings')"
            aria-label="Cài đặt"
          >
            ⚙️
          </button>
        </div>

        <div class="field">
          <label for="project-search">Tìm dự án</label>
          <input id="project-search" type="search" placeholder="Tìm dự án…" />
        </div>

        <p class="hint">
          Tab theo DOM: All → Starred → Tạo mới → Cài đặt → ô search → Về
          Portal. Enter/Space kích hoạt nút; focus ring chỉ hiện với bàn phím.
        </p>

        <a class="cta" href="#portal" style="margin-top: 0.75rem">Về Portal</a>
      </main>
    </div>
  </body>
</html>
