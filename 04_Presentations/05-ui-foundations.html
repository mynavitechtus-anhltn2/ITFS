<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UI Foundations — Semantic HTML đến Mockup → UI</title>
    <style>
      :root {
        --bg: #ffffff;
        --panel: #ffffff;
        --panel-2: #f6f6f9;
        --border: #e2e2ea;
        --text: #181825;
        --text-dim: #43435a;
        --text-faint: #8181a0;
        --accent: #4f46e5;
        --accent-active: #4338ca;
        --accent-soft: #eef0ff;
        --ok: #15803d;
        --ok-soft: #eaf6ee;
        --warn: #b45309;
        --warn-soft: #fbf1e4;
        --bad: #b91c1c;
        --bad-soft: #fdeeee;
        --info: #2f6fed;
        --info-soft: #eaf1ff;
        --spark: #7c3aed;
        --spark-soft: #f3edfd;
        --code-bg: #181825;
        --code-text: #e9e4f5;
        --radius: 14px;
        --scale: 1;
      }
      html.dark {
        --bg: #0f0f16;
        --panel: #15151f;
        --panel-2: #1b1b27;
        --border: #2b2b3a;
        --text: #f1f1f7;
        --text-dim: #c7c7d8;
        --text-faint: #7d7d96;
        --accent: #818cf8;
        --accent-active: #a5b4fc;
        --accent-soft: rgba(129, 140, 248, 0.14);
        --ok: #4ade80;
        --ok-soft: rgba(74, 222, 128, 0.12);
        --warn: #fbbf24;
        --warn-soft: rgba(251, 191, 36, 0.12);
        --bad: #f87171;
        --bad-soft: rgba(248, 113, 113, 0.12);
        --info: #7aa2f7;
        --info-soft: rgba(122, 162, 247, 0.14);
        --spark: #b79ceb;
        --spark-soft: rgba(183, 156, 235, 0.14);
        --code-bg: #0a0a10;
        --code-text: #e9e4f5;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }
      .stage {
        max-width: 1220px;
        margin: 0 auto;
        padding: 34px 28px 70px;
      }

      /* header */
      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .brand .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }
      .top-tools {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .tool-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text-dim);
        font-size: 14px;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .tool-btn:hover {
        color: var(--text);
        border-color: var(--text-faint);
      }
      .progress-wrap {
        height: 3px;
        background: var(--panel-2);
        border-radius: 99px;
        overflow: hidden;
        margin-bottom: 26px;
      }
      .progress-bar {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 0.25s ease;
      }

      .layout {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        gap: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--panel);
      }
      .side {
        border-right: 1px solid var(--border);
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: 680px;
        overflow-y: auto;
      }
      .side-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 9px;
        cursor: pointer;
        color: var(--text-dim);
        font-size: 13px;
        font-weight: 600;
      }
      .side-row:hover {
        background: var(--panel-2);
        color: var(--text);
      }
      .side-row.active {
        background: var(--accent-soft);
        color: var(--text);
      }
      .side-badge {
        flex-shrink: 0;
        min-width: 26px;
        height: 22px;
        border-radius: 7px;
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        font-size: 10.5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--text-faint);
        padding: 0 4px;
      }
      .side-row.active .side-badge {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .side-sep {
        height: 1px;
        background: var(--border);
        margin: 8px 6px;
      }

      .content {
        padding: 26px 32px 40px;
        font-size: calc(15px * var(--scale));
      }
      .content-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 6px;
      }
      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        background: var(--accent-soft);
        padding: 4px 10px;
        border-radius: 99px;
        margin-bottom: 14px;
      }
      h1.slide-title {
        font-size: calc(26px * var(--scale));
        line-height: 1.18;
        margin: 0 0 8px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      p.slide-sub {
        color: var(--text-dim);
        font-size: calc(14.5px * var(--scale));
        line-height: 1.6;
        margin: 0 0 20px;
        max-width: 780px;
      }

      .cards {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px 20px;
        background: var(--panel-2);
        min-width: 0;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 11.5px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-faint);
        margin-bottom: 12px;
      }
      .card-head .bar {
        width: 14px;
        height: 2px;
        border-radius: 99px;
        background: currentColor;
        flex: none;
      }
      .card p {
        margin: 0;
        color: var(--text-dim);
        line-height: 1.65;
        font-size: calc(14px * var(--scale));
      }
      .card ul {
        margin: 0;
        padding-left: 19px;
        color: var(--text-dim);
        line-height: 1.75;
        font-size: calc(13.6px * var(--scale));
      }
      .card ul li {
        margin-bottom: 6px;
      }
      .card ul li:last-child {
        margin-bottom: 0;
      }
      .card.why {
        border-left: 3px solid var(--accent);
      }
      .card.why .card-head {
        color: var(--accent);
      }
      .card.key {
        border-left: 3px solid var(--info);
      }
      .card.key .card-head {
        color: var(--info);
      }
      .card.compare {
        border-left: 3px solid var(--ok);
      }
      .card.compare .card-head {
        color: var(--ok);
      }
      .card.nuance {
        border-left: 3px solid var(--warn);
      }
      .card.nuance .card-head {
        color: var(--warn);
      }
      .card.check {
        border-left: 3px solid var(--ok);
      }
      .card.check .card-head {
        color: var(--ok);
      }
      .card.case {
        border-left: 3px solid var(--text-faint);
      }
      .card.case .card-head {
        color: var(--text-faint);
      }
      .card.qa {
        border-left: 3px solid var(--spark);
        background: var(--spark-soft);
      }
      .card.qa .card-head {
        color: var(--spark);
      }
      .card.figure {
        border-left: 3px solid var(--text-faint);
        background: var(--panel);
      }
      .card.figure .card-head {
        color: var(--text-faint);
      }
      /* Dùng .figure-body — không đặt class .figure trên card (tránh đè padding card) */
      .card.flowcard {
        border-left: 3px solid var(--info);
      }
      .card.flowcard .card-head {
        color: var(--info);
      }

      /* ---- sides (bad / good two-panel compare) ---- */
      .sides {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px;
      }
      @media (max-width: 640px) {
        .sides {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .pane {
        border: 1px solid var(--border);
        border-radius: 11px;
        padding: 14px 15px;
        background: var(--panel);
        min-width: 0;
      }
      .pane .hd {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .pane.bad {
        border-color: color-mix(in srgb, var(--bad) 32%, var(--border));
      }
      .pane.bad .hd {
        color: var(--bad);
      }
      .pane.good {
        border-color: color-mix(in srgb, var(--ok) 32%, var(--border));
      }
      .pane.good .hd {
        color: var(--ok);
      }
      .pane ul {
        margin: 0;
        padding-left: 18px;
        color: var(--text-dim);
        font-size: calc(13.2px * var(--scale));
        line-height: 1.6;
      }
      .pane ul li {
        margin-bottom: 4px;
      }
      .pane .code-block {
        margin-top: 8px;
      }

      .code-block {
        margin-top: 2px;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        background: var(--code-bg);
      }
      .code-label {
        font-size: 10.5px;
        color: #9d9686;
        padding: 7px 13px;
        border-bottom: 1px solid #33301f;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.02em;
      }
      .code-block pre {
        margin: 0;
        padding: 13px 15px;
        overflow-x: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: calc(12.2px * var(--scale));
        line-height: 1.6;
        color: var(--code-text);
      }

      .mini-table {
        width: 100%;
        border-collapse: collapse;
        font-size: calc(13px * var(--scale));
      }
      .mini-table th,
      .mini-table td {
        text-align: left;
        padding: 9px 12px;
        border-bottom: 1px solid var(--border);
        color: var(--text-dim);
        vertical-align: top;
      }
      .mini-table thead th {
        color: var(--text-faint);
        font-weight: 700;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: var(--panel);
      }
      .mini-table tbody tr:hover {
        background: var(--panel);
      }
      .mini-table tr:last-child td {
        border-bottom: none;
      }

      .link-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }
      .link-chip {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-dim);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--panel);
      }

      .figure-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 6px 0 0;
        width: 100%;
      }
      .figure-body svg {
        display: block;
        width: 100%;
        max-width: 480px;
        height: auto;
        min-height: 140px;
      }
      .figure-body .figure-caption {
        margin: 10px 0 0;
        padding: 0;
        width: 100%;
        max-width: 480px;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--text-faint);
        text-align: center;
      }

      .flow {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        gap: 6px;
      }
      .flow-step {
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 9px 13px;
        font-size: calc(12.6px * var(--scale));
        color: var(--text-dim);
        flex: 1 1 150px;
      }
      .flow-step .idx {
        flex: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--info);
        color: #fff;
        font-size: 10.5px;
        font-weight: 700;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        display: grid;
        place-items: center;
      }
      .flow-arrow {
        color: var(--text-faint);
        font-size: 15px;
        flex: 0 0 auto;
        padding: 0 2px;
        align-self: center;
      }

      /* cover */
      .cover {
        padding: 20px 6px 10px;
      }
      .cover .kicker {
        margin-bottom: 20px;
      }
      .cover h1 {
        font-size: calc(42px * var(--scale));
        line-height: 1.12;
        font-weight: 800;
        margin: 0 0 16px;
        letter-spacing: -0.02em;
      }
      .cover .lead {
        color: var(--text-dim);
        font-size: calc(16px * var(--scale));
        line-height: 1.7;
        max-width: 680px;
        margin: 0 0 22px;
      }
      .cover ul {
        padding-left: 19px;
        color: var(--text-dim);
        line-height: 1.85;
        font-size: calc(14px * var(--scale));
        max-width: 680px;
      }

      /* board */
      .board-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .board-col h3 {
        font-size: calc(13px * var(--scale));
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-faint);
        margin: 0 0 10px;
      }
      .board-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--panel-2);
        margin-bottom: 7px;
        font-size: calc(13.4px * var(--scale));
      }
      .board-item .num {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        color: var(--text-faint);
        min-width: 22px;
      }
      .board-item .status {
        margin-left: auto;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 99px;
        white-space: nowrap;
      }
      .status.done {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .status.pending {
        background: var(--warn-soft);
        color: var(--warn);
      }
      @media (max-width: 760px) {
        .board-grid {
          grid-template-columns: 1fr;
        }
      }

      .pager {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        margin-top: 26px;
      }
      .pbtn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 16px;
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .pbtn:hover:not(:disabled) {
        background: var(--panel-2);
        border-color: var(--text-faint);
      }
      .pbtn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .pager .count {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        color: var(--text-faint);
      }

      @media (max-width: 760px) {
        .stage {
          padding: 22px 14px 50px;
        }
        .layout {
          grid-template-columns: minmax(0, 1fr);
        }
        .side {
          flex-direction: row;
          overflow-x: auto;
          max-height: none;
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
        .side-row {
          flex-shrink: 0;
        }
        .content {
          padding: 20px 18px 28px;
        }
        .cover h1 {
          font-size: calc(28px * var(--scale));
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="top">
        <div class="brand">
          <span class="dot"></span> ITFS · Pillar 05 — UI Foundations
        </div>
        <div class="top-tools">
          <button class="tool-btn" id="fontMinus" title="Giảm cỡ chữ">
            A−
          </button>
          <button class="tool-btn" id="fontPlus" title="Tăng cỡ chữ">A+</button>
          <button class="tool-btn" id="themeToggle" title="Đổi theme">◐</button>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="layout">
        <nav class="side" id="side"></nav>
        <main class="content" id="content"></main>
      </div>

      <div class="pager">
        <button class="pbtn" id="prevBtn">←</button>
        <span class="count" id="countLabel">01 / 12</span>
        <button class="pbtn" id="nextBtn">→</button>
      </div>
    </div>

    <script>
      /* ============================================================
   UI/UX Engineering — từ Semantic HTML đến Component Architecture
   Mỗi topic: Bản chất → Kiến thức → So sánh → Nuance
   → Minh họa/Flow → Ví dụ code → Case ngành → Case thực tế
   ============================================================ */
      const slides = [
        {
          type: "cover",
          badge: "Cover",
          title: "Overview",
          data: {
            kicker: "ITFS · Pillar 05 — UI/UX Engineering · UI Foundations",
            h1: 'Từ <span style="color:var(--accent)">Semantic HTML</span> đến <span style="color:var(--accent)">Mockup → UI</span>',
            lead: "Các quyết định UI nền tảng khi code và khi review output AI — chọn thẻ, dựng layout, dùng UI library theo docs, dịch mockup thành UI đúng spec.",
            bullets: [
              "Semantics & landmarks: gắn nghĩa cho máy và đồng đội, không chỉ diện mạo.",
              "Box model · Flex/Grid · UI library theo docs · Specificity khi override.",
              "Mockup → UI đúng số; AI Fluency bề mặt; Clarify trước khi code.",
            ],
          },
        },

        {
          type: "topic",
          badge: "Intro",
          title: "Vì sao cần phản biện",
          data: {
            kicker: "Bối cảnh",
            h1: 'AI viết UI rất nhanh — và rất hay <span style="color:var(--accent)">đúng cú pháp, sai ý nghĩa</span>',
            sub: "Mỗi quyết định UI nhỏ — chọn thẻ, đặt state, cắt component, chọn breakpoint — đáng dừng 30 giây suy nghĩ, trước khi AI hoặc chính bạn code cho xong.",
            why: "Prompt một câu, AI trả ngay markup đẹp, có class, có màu. Nhưng đẹp trên màn hình không chứng minh UI đó <b>đúng nghĩa, đúng cấu trúc, dùng được bằng bàn phím</b>. Việc còn lại — và duy nhất bạn không thể giao cho AI — là biết soi vào đâu trước khi coi là xong.",
            key: [
              "<b>AI không biết bối cảnh sản phẩm</b> — không biết đây là form nội bộ hay landing public cần SEO, không biết team dùng lib nào, không biết design đã chốt spacing hay chưa.",
              '<b>"Chạy được" không phải tiêu chí đạt</b> — <code>div</code> + <code>onClick</code> vẫn click được bằng chuột, vẫn "trông giống" nút — chỉ Tab/screen reader mới lộ ra nó không phải nút thật.',
              "<b>Lỗi UI thường im lặng, không crash</b> — thiếu <code>label</code>, quên <code>alt</code>, layout vỡ ở 375px không throw error nào. Nó chỉ lặng lẽ làm mất một nhóm người dùng, tới khi audit hoặc khách hàng report.",
            ],
          },
        },

        {
          type: "topic",
          badge: "Cheat",
          title: "Câu hỏi bỏ túi",
          data: {
            kicker: "Cheat sheet · UI Foundations",
            h1: 'Mỗi chủ đề quy về <span style="color:var(--accent)">một câu hỏi bỏ túi</span>',
            sub: "Nếu chỉ nhớ được một dòng — câu hỏi ở cột giữa là thứ tự hỏi mình (hoặc hỏi lại AI) trước khi ship.",
            bigTable: {
              head: ["Chủ đề", "Câu hỏi bỏ túi", "Giá phải trả nếu bỏ qua"],
              rows: [
                [
                  "HTML Semantics",

      /* ---------------- render engine ---------------- */
      let current = 0;
      let scale = 1;

      const sideEl = document.getElementById("side");
      const contentEl = document.getElementById("content");
      const countLabel = document.getElementById("countLabel");
      const progressBar = document.getElementById("progressBar");

      function pad(n) {
        return n < 10 ? "0" + n : "" + n;
      }
      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function renderSide() {
        sideEl.innerHTML = "";
        slides.forEach((s, i) => {
          const row = document.createElement("div");
          row.className = "side-row" + (i === current ? " active" : "");
          row.innerHTML =
            '<span class="side-badge">' +
            s.badge +
            "</span><span>" +
            s.title +
            "</span>";
          row.addEventListener("click", () => {
            current = i;
            render();
          });
          sideEl.appendChild(row);
          if (s.sepAfter) {
            const sep = document.createElement("div");
            sep.className = "side-sep";
            sideEl.appendChild(sep);
          }
        });
      }

      function cardHTML(cls, headText, bodyHTML) {
        return (
          '<div class="card ' +
          cls +
          '"><div class="card-head"><span class="bar"></span>' +
          headText +
          "</div>" +
          bodyHTML +
          "</div>"
        );
      }

      function listHTML(items) {
        return (
          "<ul>" + items.map((t) => "<li>" + t + "</li>").join("") + "</ul>"
        );
      }

      function codeHTML(code) {
        if (!code) return "";
        return (
          '<div class="code-block"><div class="code-label">' +
          esc(code.label) +
          "</div><pre><code>" +
          esc(code.content) +
          "</code></pre></div>"
        );
      }

      function tableHTML(t) {
        if (!t) return "";
        let html =
          '<table class="mini-table"><thead><tr>' +
          t.head.map((h) => "<th>" + h + "</th>").join("") +
          "</tr></thead><tbody>";
        t.rows.forEach((r) => {
          html +=
            "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>";
        });
        html += "</tbody></table>";
        return html;
      }

      function flowHTML(steps) {
        let html = '<div class="flow">';
        steps.forEach((s, i) => {
          html +=
            '<div class="flow-step"><span class="idx">' +
            (i + 1) +
            "</span><span>" +
            s +
            "</span></div>";
          if (i < steps.length - 1) html += '<div class="flow-arrow">→</div>';
        });
        html += "</div>";
        return html;
      }

      function figureHTML(fig) {
        let html = '<div class="figure-body">' + fig.svg;
        if (fig.caption)
          html += '<p class="figure-caption">' + fig.caption + "</p>";
        html += "</div>";
        return html;
      }

      function qaHTML(qa) {
        return (
          "<p><b>Tình huống:</b> " +
          qa.q +
          '</p><p style="margin-top:8px"><b>Hướng giải:</b> ' +
          qa.a +
          "</p>"
        );
      }

      function sideHTML(side, kind) {
        const icon = kind === "bad" ? "✕" : "✓";
        let html =
          '<div class="pane ' +
          kind +
          '"><div class="hd">' +
          icon +
          " " +
          side.label +
          "</div>";
        if (side.items) html += listHTML(side.items);
        if (side.code) html += codeHTML(side.code);
        html += "</div>";
        return html;
      }

      function sidesHTML(sides) {
        return (
          '<div class="sides">' +
          sideHTML(sides.bad, "bad") +
          sideHTML(sides.good, "good") +
          "</div>"
        );
      }

      function renderContent() {
        const s = slides[current];
        const d = s.data;
        let html = "";

        if (s.type === "cover") {
          html += '<div class="cover">';
          html += '<div class="kicker">' + d.kicker + "</div>";
          html += "<h1>" + d.h1 + "</h1>";
          html += '<p class="lead">' + d.lead + "</p>";
          html += listHTML(d.bullets);
          html += "</div>";
        } else if (s.type === "board") {
          html += '<div class="kicker">' + d.kicker + "</div>";
          html += '<h1 class="slide-title">' + d.h1 + "</h1>";
          html += '<p class="slide-sub">' + d.sub + "</p>";
          html += '<div class="board-grid">';
          d.cols.forEach((col) => {
            html += '<div class="board-col"><h3>' + col.title + "</h3>";
            col.items.forEach(([num, label, status]) => {
              html +=
                '<div class="board-item"><span class="num">' +
                num +
                "</span><span>" +
                label +
                '</span><span class="status ' +
                status +
                '">' +
                (status === "done" ? "✓ Done" : "⬜ Pending") +
                "</span></div>";
            });
            html += "</div>";
          });
          html += "</div>";
        } else if (s.type === "topic" || s.type === "closing") {
          html +=
            '<div class="content-head"><div class="kicker">' +
            d.kicker +
            "</div></div>";
          html += '<h1 class="slide-title">' + d.h1 + "</h1>";
          html += '<p class="slide-sub">' + d.sub + "</p>";
          html += '<div class="cards">';
          if (d.why)
            html += cardHTML("why", "Bản chất", "<p>" + d.why + "</p>");
          if (d.sides)
            html += cardHTML(
              "compare",
              "So sánh trực quan",
              sidesHTML(d.sides),
            );
          if (d.key)
            html += cardHTML("key", "Kiến thức chính", listHTML(d.key));
          if (d.keyTable)
            html += cardHTML(
              "key",
              "Mô hình / phân loại",
              tableHTML(d.keyTable),
            );
          if (d.bigTable)
            html += cardHTML(
              "key",
              "Toàn cảnh — một câu hỏi bỏ túi mỗi chủ đề",
              tableHTML(d.bigTable),
            );
          if (d.compare)
            html += cardHTML(
              "compare",
              "So sánh lựa chọn",
              tableHTML(d.compare),
            );
          if (d.nuance)
            html += cardHTML("nuance", "Nuance dễ nhầm", listHTML(d.nuance));
          if (d.figure)
            html += cardHTML("figure", "Minh họa", figureHTML(d.figure));
          if (d.flow)
            html += cardHTML("flowcard", "Flow / quy trình", flowHTML(d.flow));
          if (d.code) html += cardHTML("key", "Ví dụ", codeHTML(d.code));
          if (d.caseText)
            html += cardHTML(
              "case",
              d.caseTitle || "Case study",
              "<p>" + d.caseText + "</p>",
            );
          if (d.qa)
            html += cardHTML(
              "qa",
              'Case thực tế — "nếu không có / không được ___ thì sao?"',
              qaHTML(d.qa),
            );
          if (d.next)
            html += cardHTML(
              "nuance",
              d.nextTitle || "Tiếp theo",
              listHTML(d.next),
            );
          html += "</div>";
        }

        contentEl.innerHTML = html;
      }

      function render() {
        renderSide();
        renderContent();
        countLabel.textContent = pad(current + 1) + " / " + slides.length;
        progressBar.style.width = ((current + 1) / slides.length) * 100 + "%";
        document.getElementById("prevBtn").disabled = current === 0;
        document.getElementById("nextBtn").disabled =
          current === slides.length - 1;
        window.scrollTo({ top: 0 });
      }

      document.getElementById("prevBtn").addEventListener("click", () => {
        if (current > 0) {
          current--;
          render();
        }
      });
      document.getElementById("nextBtn").addEventListener("click", () => {
        if (current < slides.length - 1) {
          current++;
          render();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" && current < slides.length - 1) {
          current++;
          render();
        }
        if (e.key === "ArrowLeft" && current > 0) {
          current--;
          render();
        }
      });

      document.getElementById("fontMinus").addEventListener("click", () => {
        scale = Math.max(0.85, scale - 0.1);
        document.documentElement.style.setProperty("--scale", scale);
      });
      document.getElementById("fontPlus").addEventListener("click", () => {
        scale = Math.min(1.35, scale + 0.1);
        document.documentElement.style.setProperty("--scale", scale);
      });
      document.getElementById("themeToggle").addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
      });

      /* Sidebar separators */
      slides.forEach((s) => {
        if (s.badge === "Cheat" || s.badge === "07") s.sepAfter = true;
      });

      render();
    </script>
